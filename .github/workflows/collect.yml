name: 每日项目学习更新

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      stage:
        description: "执行阶段：发现、同步、生成可独立续跑"
        type: choice
        options: [all, discover, sync, generate]
        default: all
      depth:
        description: "生成深度；both 根据待处理队列自动补深入解读"
        type: choice
        options: [both, quick, deep]
        default: both
      repository:
        description: "可选，指定已收录项目 owner/name"
        type: string
        required: false
      discovery_only:
        description: "兼容选项：仅同步，不调用模型"
        type: boolean
        default: false
      limit:
        description: "各阶段处理上限（1..200），不限制阅览"
        type: string
        default: "50"

permissions:
  contents: read

concurrency:
  group: github-feed-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ZERO_G_API_KEY: ${{ secrets.ZERO_G_API_KEY }}
      ZERO_G_MODEL: ${{ secrets.ZERO_G_MODEL }}
      GITHUB_TOKEN: ${{ github.token }}
      COLLECTION_LIMIT: ${{ inputs.limit || '50' }}
      DISCOVERY_ONLY: ${{ inputs.discovery_only || 'false' }}
      REQUESTED_STAGE: ${{ inputs.stage || 'all' }}
      REQUESTED_DEPTH: ${{ inputs.depth || 'both' }}
      REQUESTED_REPOSITORY: ${{ inputs.repository || '' }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: 初始化数据库
        run: npm run db:migrate
      - name: 检查到期阶段并追赶
        shell: bash
        run: |
          arguments=(--limit "$COLLECTION_LIMIT")
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            arguments+=(--scheduled)
          else
            arguments+=(--stage "$REQUESTED_STAGE")
            if [[ "$DISCOVERY_ONLY" == "true" ]]; then arguments+=(--discovery-only); fi
            if [[ "$REQUESTED_DEPTH" != "both" ]]; then arguments+=(--depth "$REQUESTED_DEPTH"); fi
            if [[ -n "$REQUESTED_REPOSITORY" ]]; then arguments+=(--repository "$REQUESTED_REPOSITORY"); fi
          fi
          node --env-file-if-exists=.env.local --import tsx scripts/scheduled-collect.ts "${arguments[@]}"
